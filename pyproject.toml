[project]
name = "paper-podcast"
version = "0.1.0"
description = "zotero library tools and a daily paper podcast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "lameenc>=1.9.0",
    "mutagen>=1.48.1",
    "pypdf>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
paper-podcast = "paper_podcast.cli:main"
paper-pick = "paper_podcast.cli:pick_main"
